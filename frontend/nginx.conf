# Routes connues de la SPA : tout le reste répond 404 (avec la page « introuvable » de l'appli) au lieu d'un faux 200 (soft-404)
map $uri $spa_known {
    default 0;
    ~^/$ 1;
    ~^/(destinations|blog|a-propos|faq|aide|impact|comment-ca-marche|kozz-monde|telephones-compatibles|devenir-partenaire|cgv|mentions-legales|confidentialite|retractation|remboursement|profil|admin|connexion|mot-de-passe-oublie)/?$ 1;
    "~^/blog/(qu-est-ce-qu-une-esim|telephone-compatible-esim|installer-esim-iphone-android|activer-esim-a-l-arrivee|quel-forfait-esim-choisir|payer-esim-prix-tva-facture|esim-ne-fonctionne-pas-remboursement|esim-solidaire-dons-impact-parrainage|compte-donnees-esim|esim-roaming-ou-sim-locale|partage-de-connexion-esim-voyage|esim-illimitee-usage-raisonnable|debloquer-son-telephone-avant-de-partir|iphone-chine-hong-kong-macao-esim|esim-tablette-montre-ordinateur|esim-en-famille-plusieurs-appareils|garder-son-numero-double-sim|qr-code-esim-non-valide-solutions|droit-de-retractation-esim|calculer-sa-data-de-voyage|parrainage-kozzgo-gagner-1-50-euro|esim-maroc-guide|esim-japon-guide|esim-etats-unis-guide)/?$" 1;
    "~^/destinations/(ad|ae|ag|ai|al|am|ar|at|au|aw|ax|az|ba|bb|bd|be|bf|bg|bh|bj|bl|bn|bo|bq|br|bs|bw|by|bz|ca|cd|cf|cg|ch|ci|cl|cm|cn|co|cr|cu|cw|cy|cz|de|dk|dm|do|dz|ec|ee|eg|es|eu|fi|fj|fo|fr|ga|gb|gd|ge|gf|gg|gh|gi|gl|gm|gn|gp|gr|gt|gu|gw|gy|hk|hn|hr|ht|hu|id|ie|il|im|in|iq|is|it|je|jm|jo|jp|ke|kg|kh|kn|kr|kw|ky|kz|la|lc|li|lk|lr|ls|lt|lu|lv|ma|mc|md|me|mf|mg|mk|ml|mm|mn|mo|mq|mr|mt|mu|mv|mw|mx|my|mz|na|nc|ne|ng|ni|nl|no|np|nz|om|pa|pe|pf|ph|pk|pl|pm|pr|ps|pt|py|qa|re|ro|rs|ru|rw|sa|sc|se|sg|si|sk|sn|sr|sv|sx|sz|tc|td|th|tj|tl|tn|tr|tw|tz|ua|ug|us|uy|uz|vc|vn|yt|za)/?$" 1;   # codes pays réels (sinon 404 réel, pas de soft-404) : à régénérer si une destination est ajoutée
    ~^/(commande|mot-de-passe|passeport)/[A-Za-z0-9_/-]+$ 1;
    ~^/index\.html$ 1;
    ~^/__prerender/ 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /index.html;   # l'appli affiche sa propre page « introuvable » (le statut reste 404)

    location = /index.html {
        add_header Cache-Control "no-cache";   # toujours la dernière version (les fichiers /assets/ sont versionnés et mis en cache 1 an)
    }

    location / {
        if ($spa_known = 0) { return 404; }
        try_files $uri /index.html;   # routage SPA React
    }

    # Instantanés HTML des pages publiques (servis aux robots sans JavaScript par Caddy). Repli sur la SPA si une page n'a pas d'instantané.
    location /__prerender/ {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Un fichier statique inconnu doit répondre 404 (et non la page d'accueil de la SPA) : évite les faux 200 sur /llms.txt, /ads.txt…
    location ~* \.(txt|xml|json|map|ico|png|jpg|jpeg|webp|svg|woff2?|js|css|webmanifest)$ {
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
