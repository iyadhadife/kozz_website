services:
  proxy:
    build: ./proxy
    container_name: kozz_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data      # certificats SSL (à conserver !)
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - chatbot
    networks:
      - web
      - internal

  frontend:
    build: ./frontend
    container_name: kozz_frontend
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    container_name: kozz_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      SITE_URL: https://${DOMAIN:-localhost}   # URLs de retour après paiement Stripe
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - data

  chatbot:
    build: ./chatbot
    container_name: kozz_chatbot
    restart: unless-stopped
    env_file: .env
    networks:
      - internal

  db:
    build: ./db
    container_name: kozz_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kozz}
      MYSQL_USER: ${MYSQL_USER:-kozz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?définir MYSQL_PASSWORD dans .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - data          # réseau isolé : seul le backend peut joindre la base

volumes:
  caddy_data:
  caddy_config:
  mysql_data:

networks:
  web:
  internal:
  data:
    internal: true     # aucun accès Internet ni depuis l'extérieur
